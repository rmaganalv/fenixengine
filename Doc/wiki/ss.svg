<svg width="800" height="600">
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20px" text-anchor="middle">Arquitectura del ERP Kaisen v1.0.0</text>
  
  <!-- Capa de Servicios -->
  <circle cx="400" cy="150" r="30" fill="#ADD8E6"/>
  <text x="400" y="170" font-family="Arial, sans-serif" text-anchor="middle">Kaisen.WebApi</text>
  
  <!-- Capa de Web -->
  <circle cx="250" cy="350" r="30" fill="#BFEFFF"/>
  <text x="250" y="370" font-family="Arial, sans-serif" text-anchor="middle">Kaisen.Web</text>
  
  <!-- Capa de Mobile -->
  <circle cx="550" cy="350" r="30" fill="#BFEFFF"/>
  <text x="550" y="370" font-family="Arial, sans-serif" text-anchor="middle">Kaisen.Mobile</text>
  
  <!-- Conexiones -->
  <line x1="250" y1="350" x2="400" y2="160" stroke="#8B9DC3"/>
  <line x1="550" y1="350" x2="400" y2="160" stroke="#8B9DC3"/>

  <!-- Carpetas de Solución -->
  <text x="70" y="200" font-family="Arial, sans-serif">apps/</text>
